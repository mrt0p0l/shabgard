[package]
name = "shabgard"
version = "1.0.0"
edition = "2021"
description = "شبگرد — کلاینتِ ضدِ سانسور"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
# WARP: تولیدِ کلیدِ X25519 برای ثبت‌نامِ خودکار در کلادفلر
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
