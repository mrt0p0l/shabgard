<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eae6da"/><stop offset="1" stop-color="#f3f0e7"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#4fe07a" stop-opacity=".22"/><stop offset="1" stop-color="#4fe07a" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)" rx="0"/>

<!-- power button (hero element of the app) -->
<g transform="translate(1046,320)">
  <circle r="190" fill="url(#glow)"/>
  <circle r="118" fill="#ffffff" stroke="#0d0d0d" stroke-width="3" stroke="#0d0d0d" stroke-width="2"/>
  <circle r="118" fill="none" stroke="#4fe07a" stroke-width="4" opacity=".85"/>
  <g stroke="#4fe07a" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="0" y1="-58" x2="0" y2="-6"/>
    <path d="M -46,-34 A 56,56 0 1,0 46,-34" transform="translate(0,12)"/>
  </g>
</g>

<!-- brand -->
<text x="96" y="212" font-family="Vazirmatn,'Segoe UI',Tahoma,sans-serif" direction="rtl"
      font-size="118" font-weight="700" fill="#0d0d0d">شبگرد</text>
<text x="100" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="27"
      letter-spacing="15" fill="#5b5b5b">SHABGARD</text>

<rect x="98" y="296" width="86" height="6" rx="3" fill="#4fe07a"/>

<text x="98" y="368" font-family="Vazirmatn,'Segoe UI',Tahoma,sans-serif" direction="rtl"
      font-size="33" fill="#0d0d0d">ضدِ سانسور · سریع · بدونِ حساب</text>

<!-- feature chips -->
<g font-family="Vazirmatn,'Segoe UI',Tahoma,sans-serif" font-size="20" fill="#0d0d0d">
  <rect x="98"  y="420" width="168" height="52" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5"/>
  <circle cx="126" cy="446" r="5" fill="#4fe07a"/><text x="144" y="453">۹+ پروتکل</text>
  <rect x="280" y="420" width="188" height="52" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5"/>
  <circle cx="308" cy="446" r="5" fill="#ffe14d"/><text x="326" y="453">TUN و حالت گیم</text>
  <rect x="482" y="420" width="178" height="52" rx="10" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5"/>
  <circle cx="510" cy="446" r="5" fill="#4fe07a"/><text x="528" y="453">بدون آنالیتیکس</text>
</g>

<!-- footer -->
<text x="98" y="556" font-family="Vazirmatn,'Segoe UI',Tahoma,sans-serif" font-size="21"
      fill="#5b5b5b">متن‌باز · رایگان · github.com/shabgard-app/shabgard</text>
<text x="1182" y="600" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif"
      font-size="17" letter-spacing="3" fill="#5b5b5b" opacity=".8">بروتالیسم</text>
</svg>